name: Auto Update

on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run update script
        run: bash update.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify build
        if: steps.changes.outputs.changed == 'true'
        run: nix build .#pelican-panel .#wings

      - name: Get versions
        if: steps.changes.outputs.changed == 'true'
        id: versions
        run: |
          panel=$(grep -m1 'version = ' lib/pelican-panel.nix | grep -oP '"[^"]+"' | tr -d '"')
          wings=$(grep -m1 'version = ' lib/wings.nix | grep -oP '"[^"]+"' | tr -d '"')
          echo "panel=$panel" >> "$GITHUB_OUTPUT"
          echo "wings=$wings" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          branch="auto-update/$(date +%Y-%m-%d)"
          git checkout -b "$branch"
          git add lib/
          git commit -m "chore: update panel to ${{ steps.versions.outputs.panel }}, wings to ${{ steps.versions.outputs.wings }}"
          git push origin "$branch"

          build_line="**Build:** ✅ passing"

          url=$(gh pr create \
            --title "chore: update panel ${{ steps.versions.outputs.panel }}, wings ${{ steps.versions.outputs.wings }}" \
            --body "Automated weekly update via update.sh.

          $build_line" \
            --base main \
            --head "$branch")

          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Auto-merge
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.pr.outputs.url }}" --squash --delete-branch
